name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test --verbosity normal

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows (win-x64)
        run: dotnet publish VidShrink.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\setup.iss

      - name: Create Portable Zip
        run: |
          tar -a -c -f installer\VidShrink-win-x64-portable.zip -C publish\win-x64 VidShrink.App.exe av_libglesv2.dll libHarfBuzzSharp.dll libSkiaSharp.dll

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: VidShrinkSetup
          path: installer/VidShrinkSetup.exe

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: VidShrink-win-x64-portable
          path: installer/VidShrink-win-x64-portable.zip

  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Linux (linux-x64)
        run: dotnet publish VidShrink.App -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/linux-x64

      - name: Package Linux Distribution
        run: |
          mkdir -p VidShrink-linux-x64
          cp publish/linux-x64/VidShrink.App VidShrink-linux-x64/
          cp publish/linux-x64/*.so VidShrink-linux-x64/ 2>/dev/null || true
          cp installer/linux/install.sh VidShrink-linux-x64/
          cp installer/linux/vidshrink.desktop VidShrink-linux-x64/
          cp installer/linux/icon.png VidShrink-linux-x64/
          chmod +x VidShrink-linux-x64/install.sh
          chmod +x VidShrink-linux-x64/VidShrink.App
          tar -czvf VidShrink-linux-x64.tar.gz VidShrink-linux-x64

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v4
        with:
          name: VidShrink-linux-x64
          path: VidShrink-linux-x64.tar.gz

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: VidShrinkSetup
          path: release-assets/

      - name: Download Windows Portable
        uses: actions/download-artifact@v4
        with:
          name: VidShrink-win-x64-portable
          path: release-assets/

      - name: Download Linux Archive
        uses: actions/download-artifact@v4
        with:
          name: VidShrink-linux-x64
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.0' }}
          name: Release ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.0' }}
          files: release-assets/*
          generate_release_notes: true
